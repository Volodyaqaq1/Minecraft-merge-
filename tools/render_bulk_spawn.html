<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage 3: Bulk Incubator Staggered Spawn Test</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#111625; display:flex; align-items:center; justify-content:center; }
        #game-container { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="../src/config.js"></script>
    <script src="../src/data/mobs.js"></script>
    <script src="../src/data/bot_names.js"></script>
    <script src="../src/utils/helpers.js"></script>
    <script src="../src/utils/SoundManager.js"></script>
    <script src="../src/components/SaveManager.js"></script>
    <script src="../src/components/Economy.js"></script>
    <script src="../src/components/MergeField.js"></script>
    <script src="../src/components/BattleSystem.js"></script>
    <script src="../src/scenes/BootScene.js"></script>
    <script src="../src/scenes/GameScene.js"></script>
</head>
<body>
<div id="game-container"></div>
<div id="snapshot"></div>
<script>
const mockState = {
    coins: 25000, playerLevel: 5, maxMobLevel: 10, unlockedTiers: [1],
    field: [
        { id: 'm1', mobLevel: 5, x: 260, y: 220 }, // Кролик
        { id: 'm2', mobLevel: 7, x: 700, y: 220 }, // Зомбик
    ],
    collection: [1,2,3,4,5,6,7],
    shownModals: [1,2,3,4,5,6,7],
    incubatorSlots: [
        { id: 0, unlockLevel: 5, active: false, endTime: 0, durationMinutes: 0, mobCount: 0, mobLevel: 0 },
        { id: 1, unlockLevel: 15, active: false, endTime: 0, durationMinutes: 0, mobCount: 0, mobLevel: 0 },
        { id: 2, unlockLevel: 25, active: false, endTime: 0, durationMinutes: 0, mobCount: 0, mobLevel: 0 },
    ],
    playtime: { totalSeconds: 120, claimed: {} },
    quests: []
};
localStorage.setItem('bestiary_squishy_save_v1', JSON.stringify(mockState));

BootScene.prototype.preload = function() {
    this._createColorTexture('bg_game',   0x2d5a27, 960, 540);
    this._createColorTexture('bg_battle', 0x1a1a2e, 960, 540);
    for (let baseId = 1; baseId <= 10; baseId++) {
        const pad = String(baseId).padStart(2, '0');
        const spritePath = `../assets/mobs/sprites/256/mob_${pad}.png`;
        const portraitPath = `../assets/mobs/portraits/256/mob_${pad}.png`;
        this.load.image(`mob_sprite_${pad}`, spritePath);
        this.load.image(`mob_${pad}`, spritePath);
        this.load.image(`mob_${pad}_sm`, spritePath);
        this.load.image(`mob_portrait_${pad}`, portraitPath);
    }
    this.load.image('icon_gem',   '../assets/icons/gem.png');
    this.load.image('icon_sword', '../assets/icons/sword.png');
    this.load.image('icon_chest', '../assets/icons/chest.png');
    this.load.image('icon_egg',   '../assets/icons/egg.png');
    this.load.image('icon_gear',  '../assets/icons/gear.png');
};

CONFIG.DEBUG = false;

const renderScale = CONFIG.RENDER_SCALE || 2.0;
const config = {
    type: Phaser.AUTO,
    width: Math.round(CONFIG.WIDTH * renderScale),
    height: Math.round(CONFIG.HEIGHT * renderScale),
    parent: 'game-container',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    backgroundColor: '#111625',
    render: { pixelArt: false, antialias: true, antialiasGL: true, roundPixels: false },
    scene: [BootScene, GameScene]
};

window.game = new Phaser.Game(config);

let frameCount = 0;
let bulkSpawnTriggered = false;
let captured = false;
let initialMobCount = 0;

function pollCapture() {
    const scene = window.game && window.game.scene ? window.game.scene.getScene('GameScene') : null;
    if (scene && scene.scene.isActive() && scene.mergeField && scene.mergeField.mobs.length >= 2) {
        frameCount++;

        if (frameCount === 6 && !bulkSpawnTriggered) {
            bulkSpawnTriggered = true;
            initialMobCount = scene.mergeField.mobs.length;
            
            // Trigger production staggered bulk spawn of 6 Хрюша (level 2)
            scene.mergeField.spawnMobsStaggered(2, 6, (spawned) => {
                const finalCount = scene.mergeField.mobs.length;
                console.log(`BULK_SPAWN_DONE: expected ${initialMobCount + 6}, actual ${finalCount}`);
                window.__bulkSpawnPassed = (finalCount === initialMobCount + 6);
            });
        }

        // Frame 14: Midpoint of staggered sequence (~180ms in)
        // Some mobs have popped in, others are mid-spawn scale or waiting their stagger frame
        if (frameCount >= 14 && bulkSpawnTriggered && !captured) {
            captured = true;
            window.game.renderer.snapshot((image) => {
                document.getElementById('snapshot').textContent = image.src;
                document.title = 'SNAPSHOT_DONE';
                window.game.destroy(true);
            });
            return;
        }
    }
    requestAnimationFrame(pollCapture);
}
requestAnimationFrame(pollCapture);
</script>
</body>
</html>
