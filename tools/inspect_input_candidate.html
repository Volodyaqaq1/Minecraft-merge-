<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<script>
function start() {
    new Phaser.Game({
        type: Phaser.HEADLESS,
        width: 100,
        height: 100,
        scene: {
            create() {
                const imProto = this.input.manager.constructor.prototype;
                const fn = imProto.inputCandidate.toString();
                document.title = 'RESULTS_JSON:' + encodeURIComponent(JSON.stringify({ fn }));
                this.game.destroy(true);
            }
        }
    });
}
start();
</script>
</body>
</html>
