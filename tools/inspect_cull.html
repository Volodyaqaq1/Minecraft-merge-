<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
<script>
function start() {
    new Phaser.Game({
        type: Phaser.HEADLESS,
        width: 100,
        height: 100,
        scene: {
            create() {
                const cProto = this.cameras.main.constructor.prototype;
                const cullFn = cProto.cull ? cProto.cull.toString() : null;
                const go = this.add.rectangle(480, 270, 80, 80);
                const wrFn = go.willRender ? go.willRender.toString() : null;
                document.title = 'RESULTS_JSON:' + encodeURIComponent(JSON.stringify({ cullFn, wrFn }));
                this.game.destroy(true);
            }
        }
    });
}
start();
</script>
</body>
</html>
