<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#111625; }
        #game-container { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    </style>
</head>
<body>
<div id="game-container"></div>
<script>
const LOGICAL_WIDTH = 960;
const LOGICAL_HEIGHT = 540;
const RENDER_SCALE = 2; // 1920x1080 physical

function start() {
    new Phaser.Game({
        type: Phaser.WEBGL,
        width: LOGICAL_WIDTH * RENDER_SCALE,
        height: LOGICAL_HEIGHT * RENDER_SCALE,
        parent: 'game-container',
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH,
        },
        scene: {
            create() {
                const cam = this.cameras.main;
                cam.setZoom(RENDER_SCALE);
                cam.centerOn(LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2);

                const item = this.add.rectangle(480, 270, 80, 80, 0x00ff88).setInteractive();
                this.input.setDraggable(item);

                const eventsLogged = [];

                item.on('pointerdown', (ptr) => {
                    eventsLogged.push({
                        type: 'pointerdown',
                        ptrX: ptr.x,
                        ptrY: ptr.y,
                        worldX: ptr.worldX,
                        worldY: ptr.worldY,
                        itemX: item.x,
                        itemY: item.y
                    });
                });

                item.on('drag', (ptr, dragX, dragY) => {
                    item.x = dragX;
                    item.y = dragY;
                    eventsLogged.push({
                        type: 'drag',
                        dragX,
                        dragY,
                        worldX: ptr.worldX,
                        worldY: ptr.worldY,
                        itemX: item.x,
                        itemY: item.y
                    });
                });

                item.on('dragend', (ptr) => {
                    eventsLogged.push({
                        type: 'dragend',
                        worldX: ptr.worldX,
                        worldY: ptr.worldY,
                        finalItemX: item.x,
                        finalItemY: item.y
                    });
                });

                // Wait 1 frame for input system to initialize
                this.time.delayedCall(50, () => {
                    const canvas = this.scale.canvas;
                    const rect = canvas.getBoundingClientRect();

                    // 1. Dispatch pointerdown at screen center (logical 480, 270 -> screen center)
                    const screenCenterX = rect.left + rect.width / 2;
                    const screenCenterY = rect.top + rect.height / 2;

                    canvas.dispatchEvent(new PointerEvent('pointerdown', {
                        clientX: screenCenterX,
                        clientY: screenCenterY,
                        bubbles: true,
                        isPrimary: true,
                        button: 0
                    }));

                    // 2. Dispatch pointermove (drag right 50 CSS pixels = +25 logical units if 2x)
                    // Let's compute how many CSS pixels is 50 logical units:
                    const cssScale = rect.width / LOGICAL_WIDTH;
                    const targetLogicalX = 530;
                    const targetLogicalY = 320;
                    const targetClientX = rect.left + targetLogicalX * cssScale;
                    const targetClientY = rect.top + targetLogicalY * cssScale;

                    canvas.dispatchEvent(new PointerEvent('pointermove', {
                        clientX: targetClientX,
                        clientY: targetClientY,
                        bubbles: true,
                        isPrimary: true,
                        button: 0,
                        buttons: 1
                    }));

                    // 3. Dispatch pointerup
                    canvas.dispatchEvent(new PointerEvent('pointerup', {
                        clientX: targetClientX,
                        clientY: targetClientY,
                        bubbles: true,
                        isPrimary: true,
                        button: 0
                    }));

                    // Check result after input loop processes events
                    this.time.delayedCall(50, () => {
                        const results = {
                            canvasPhysical: { w: canvas.width, h: canvas.height },
                            canvasCSS: { w: Math.round(rect.width), h: Math.round(rect.height) },
                            eventsCount: eventsLogged.length,
                            events: eventsLogged,
                            itemFinalPos: { x: item.x, y: item.y },
                            isDragAccurate: Math.abs(item.x - 530) < 1 && Math.abs(item.y - 320) < 1
                        };
                        document.title = 'RESULTS_JSON:' + encodeURIComponent(JSON.stringify(results));
                        this.game.destroy(true);
                    });
                });
            }
        }
    });
}

start();
</script>
</body>
</html>
