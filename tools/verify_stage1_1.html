<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#111625; }
        #game-container { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="../src/config.js"></script>
    <script src="../src/utils/helpers.js"></script>
</head>
<body>
<div id="game-container"></div>
<script>
function start() {
    const renderScale = (typeof CONFIG !== 'undefined' && CONFIG.RENDER_SCALE) ? CONFIG.RENDER_SCALE : 2.0;
    const config = {
        type: Phaser.AUTO,
        width: Math.round(CONFIG.WIDTH * renderScale),
        height: Math.round(CONFIG.HEIGHT * renderScale),
        parent: 'game-container',
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH,
        },
        backgroundColor: '#111625',
        render: {
            pixelArt: false,
            antialias: true,
            antialiasGL: true,
            roundPixels: false,
            powerPreference: 'high-performance',
        },
        scene: {
            create() {
                // Initialize HiDPI camera zoom and center
                setupSceneHiDPICamera(this);

                const cam = this.cameras.main;
                const canvas = this.scale.canvas;
                const rect = canvas.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;

                // 1. Text resolution tests
                // t1: constructor resolution
                const t1 = this.add.text(100, 100, 'T1 Constructor', {
                    fontSize: '20px',
                    resolution: 2
                });

                // t2: post-creation setResolution
                const t2 = this.add.text(100, 150, 'T2 Dynamic', {
                    fontSize: '20px'
                });
                t2.setResolution(2);

                // t3: createHDText helper
                const t3 = createHDText(this, 100, 200, 'T3 HDText', {
                    fontSize: '20px'
                });

                // 2. Interactive GameObject hit test at logical center (480, 270)
                const centerItem = this.add.rectangle(480, 270, 80, 80, 0x00ff88).setInteractive();
                this.input.setDraggable(centerItem);

                // 3. Pointer transformation test
                const centerPageX = rect.left + rect.width / 2;
                const centerPageY = rect.top + rect.height / 2;
                const transX = this.scale.transformX(centerPageX);
                const transY = this.scale.transformY(centerPageY);
                const logicalPointer = getLogicalPointer({ x: transX, y: transY }, this);

                // Corner test: top-left (0,0) and bottom-right (960, 540)
                const topLeftLogical = getLogicalPointer({
                    x: this.scale.transformX(rect.left),
                    y: this.scale.transformY(rect.top)
                }, this);
                const bottomRightLogical = getLogicalPointer({
                    x: this.scale.transformX(rect.left + rect.width),
                    y: this.scale.transformY(rect.top + rect.height)
                }, this);

                // 4. Hit test on centerItem
                const hits = this.input.manager.hitTest({ x: transX, y: transY }, [centerItem], cam);
                const hitItem = hits.length > 0 && hits[0] === centerItem;

                // 5. Drag delta verification
                const movedRawX = transX + 50 * renderScale;
                const movedRawY = transY + 50 * renderScale;
                const movedLogical = getLogicalPointer({ x: movedRawX, y: movedRawY }, this);

                const data = {
                    viewport: {
                        windowW: window.innerWidth,
                        windowH: window.innerHeight,
                        dpr: dpr
                    },
                    canvas: {
                        backingW: canvas.width,
                        backingH: canvas.height,
                        cssW: Math.round(rect.width),
                        cssH: Math.round(rect.height),
                        expectedPhysicalW: Math.round(rect.width * dpr),
                        expectedPhysicalH: Math.round(rect.height * dpr),
                        upscaleRatio: Number(((rect.width * dpr) / canvas.width).toFixed(3)),
                        renderScale: renderScale
                    },
                    logicalCoords: {
                        logicalCenter: { x: Number(logicalPointer.x.toFixed(2)), y: Number(logicalPointer.y.toFixed(2)) },
                        isCenterCorrect: Math.abs(logicalPointer.x - 480) < 0.5 && Math.abs(logicalPointer.y - 270) < 0.5,
                        topLeft: { x: Number(topLeftLogical.x.toFixed(2)), y: Number(topLeftLogical.y.toFixed(2)) },
                        bottomRight: { x: Number(bottomRightLogical.x.toFixed(2)), y: Number(bottomRightLogical.y.toFixed(2)) }
                    },
                    interaction: {
                        hitTestPassed: hitItem,
                        dragDeltaLogical: {
                            dx: Number((movedLogical.x - logicalPointer.x).toFixed(2)),
                            dy: Number((movedLogical.y - logicalPointer.y).toFixed(2))
                        },
                        expectedDragDelta: { dx: 50, dy: 50 }
                    },
                    text: {
                        t1_style_resolution: t1.style.resolution,
                        t1_frame_source_resolution: t1.frame && t1.frame.source ? t1.frame.source.resolution : null,
                        t2_style_resolution: t2.style.resolution,
                        t2_frame_source_resolution: t2.frame && t2.frame.source ? t2.frame.source.resolution : null,
                        t3_style_resolution: t3.style.resolution,
                        t3_frame_source_resolution: t3.frame && t3.frame.source ? t3.frame.source.resolution : null,
                        t3_text_resolution: t3.resolution
                    }
                };

                document.title = 'RESULTS_JSON:' + encodeURIComponent(JSON.stringify(data));
                this.game.destroy(true);
            }
        }
    };

    new Phaser.Game(config);
}
start();
</script>
</body>
</html>
