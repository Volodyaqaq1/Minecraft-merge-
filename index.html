<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Майнкрафт Мёрдж</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111625;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
        }
        #loading {
            position: fixed;
            inset: 0;
            background: #111625;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #5dff6e;
            font-family: sans-serif;
            font-size: 20px;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading .title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        #loading .bar-wrap {
            width: 300px;
            height: 18px;
            background: #222;
            border-radius: 9px;
            overflow: hidden;
            margin-top: 14px;
            border: 2px solid #444;
        }
        #loading .bar {
            height: 100%;
            background: linear-gradient(90deg, #5dff6e, #00c9ff);
            border-radius: 9px;
            width: 0%;
            transition: width 0.3s;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #rotate-device {
            display: none;
            position: fixed;
            inset: 0;
            background: #111625;
            z-index: 100000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 24px;
        }
        #rotate-device .rotate-icon {
            font-size: 64px;
            margin-bottom: 18px;
            animation: phoneRotate 2.2s ease-in-out infinite;
        }
        #rotate-device .rotate-title {
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
        }
        #rotate-device .rotate-sub {
            font-size: 14px;
            color: #a0aec0;
            max-width: 320px;
            line-height: 1.4;
        }
        @keyframes phoneRotate {
            0%, 20% { transform: rotate(0deg); }
            50%, 80% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #rotate-device {
                display: flex !important;
            }
        }
    </style>
</head>
<body>
    <div id="rotate-device">
        <div class="rotate-icon">📱🔄</div>
        <div class="rotate-title">Поверните телефон</div>
        <div class="rotate-sub">Для комфортной игры, пожалуйста, держите телефон горизонтально</div>
    </div>

    <div id="game-container"></div>

    <div id="loading">
        <div class="title">🧱 Майнкрафт Мёрдж</div>
        <div>Загрузка...</div>
        <div class="bar-wrap">
            <div class="bar" id="loadBar"></div>
        </div>
    </div>

    <!-- Phaser 3.8 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <!-- Yandex Games SDK -->
    <script src="/sdk.js" onerror="window.ysdk = null"></script>

    <!-- Game files -->
    <script src="src/config.js"></script>
    <script src="src/data/mobs.js"></script>
    <script src="src/data/bot_names.js"></script>
    <script src="src/utils/helpers.js"></script>
    <script src="src/utils/SoundManager.js"></script>
    <script src="src/components/SaveManager.js"></script>
    <script src="src/components/Economy.js"></script>
    <script src="src/components/MergeField.js"></script>
    <script src="src/components/BattleSystem.js"></script>
    <script src="src/scenes/BootScene.js"></script>
    <script src="src/scenes/GameScene.js"></script>
    <script src="src/scenes/BattleScene.js"></script>
    <script src="src/scenes/CollectionScene.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
