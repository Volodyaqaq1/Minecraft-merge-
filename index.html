<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Кубический Бестиарий: Сквиши Мёрдж</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111625;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            image-rendering: auto;
        }
        #loading {
            position: fixed;
            inset: 0;
            background: #111625;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #5dff6e;
            font-size: 20px;
            font-weight: 800;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading .title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 20px;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255,215,0,0.5);
        }
        #loading .bar-wrap {
            width: 300px;
            height: 18px;
            background: #222;
            border-radius: 9px;
            overflow: hidden;
            margin-top: 14px;
            border: 2px solid #444;
        }
        #loading .bar {
            height: 100%;
            background: linear-gradient(90deg, #5dff6e, #00c9ff);
            border-radius: 9px;
            width: 0%;
            transition: width 0.3s;
        }

        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #rotate-device {
            display: none !important;
            position: fixed;
            inset: 0;
            background: #111625;
            z-index: 100000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 24px;
        }
        #rotate-device .rotate-icon {
            font-size: 64px;
            margin-bottom: 18px;
            animation: phoneRotate 2.2s ease-in-out infinite;
        }
        #rotate-device .rotate-title {
            font-size: 22px;
            font-weight: 900;
            color: #ffd700;
            margin-bottom: 10px;
        }
        #rotate-device .rotate-sub {
            font-size: 14px;
            color: #a0aec0;
            max-width: 320px;
            line-height: 1.4;
            font-weight: 700;
        }
        #dismiss-rotate {
            margin-top: 22px;
            padding: 10px 22px;
            background: rgba(255, 255, 255, 0.12);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            color: #cbd5e1;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
        }
        #dismiss-rotate:active {
            background: rgba(255, 255, 255, 0.25);
        }
        @keyframes phoneRotate {
            0%, 20% { transform: rotate(0deg); }
            50%, 80% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        /* Показываем плашку ТОЛЬКО на реальных мобильных телефонах с тачскрином в вертикальном положении */
        @media screen and (orientation: portrait) and (max-width: 900px) and (hover: none) and (pointer: coarse) {
            body.is-mobile-touch #rotate-device {
                display: flex !important;
            }
        }
    </style>
</head>
<body>
    <div id="rotate-device">
        <div class="rotate-icon">📱🔄</div>
        <div class="rotate-title">Поверните телефон</div>
        <div class="rotate-sub">Для комфортной игры, пожалуйста, держите телефон горизонтально</div>
        <button id="dismiss-rotate" type="button">Играть вертикально ✕</button>
    </div>

    <script>
        (function() {
            // Строго проверяем, что это мобильное устройство с тач-экраном (не ПК / ноутбук)
            var isTouchMobile = /Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent) || 
                (window.matchMedia && window.matchMedia('(pointer: coarse)').matches && !window.matchMedia('(pointer: fine)').matches);

            if (isTouchMobile) {
                document.body.classList.add('is-mobile-touch');
            }

            var rotateBox = document.getElementById('rotate-device');
            var dismissBtn = document.getElementById('dismiss-rotate');
            if (dismissBtn && rotateBox) {
                dismissBtn.addEventListener('click', function() {
                    rotateBox.style.setProperty('display', 'none', 'important');
                });
            }
        })();
    </script>

    <div id="game-container"></div>

    <div id="loading">
        <div class="title">✨ Кубический Бестиарий ✨</div>
        <div>Загрузка...</div>
        <div class="bar-wrap">
            <div class="bar" id="loadBar"></div>
        </div>
    </div>

    <!-- Phaser 3.8 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <!-- Yandex Games SDK -->
    <script src="/sdk.js" onerror="window.ysdk = null"></script>

    <!-- Game files -->
    <script src="src/config.js"></script>
    <script src="src/data/mobs.js"></script>
    <script src="src/data/worlds.js"></script>
    <script src="src/data/bot_names.js"></script>
    <script src="src/utils/helpers.js"></script>
    <script src="src/utils/SoundManager.js"></script>
    <script src="src/components/SaveManager.js"></script>
    <script src="src/components/Economy.js"></script>
    <script src="src/components/MergeField.js"></script>
    <script src="src/components/BattleSystem.js"></script>
    <script src="src/scenes/BootScene.js"></script>
    <script src="src/scenes/GameScene.js"></script>
    <script src="src/scenes/BattleScene.js"></script>
    <script src="src/scenes/CollectionScene.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
