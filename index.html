<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Майнкрафт Мёрдж</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        #loading {
            position: fixed;
            inset: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #5dff6e;
            font-family: monospace;
            font-size: 20px;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #5dff6e;
        }
        #loading .bar-wrap {
            width: 300px;
            height: 16px;
            background: #333;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 12px;
        }
        #loading .bar {
            height: 100%;
            background: linear-gradient(90deg, #5dff6e, #00c9ff);
            border-radius: 8px;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="title">🧱 Майнкрафт Мёрдж</div>
        <div>Загрузка...</div>
        <div class="bar-wrap">
            <div class="bar" id="loadBar"></div>
        </div>
    </div>

    <!-- Phaser 3.8 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <!-- Yandex Games SDK -->
    <script src="/sdk.js" onerror="window.ysdk = null"></script>

    <!-- Game files -->
    <script src="src/config.js"></script>
    <script src="src/data/mobs.js"></script>
    <script src="src/data/bot_names.js"></script>
    <script src="src/utils/helpers.js"></script>
    <script src="src/components/SaveManager.js"></script>
    <script src="src/components/Economy.js"></script>
    <script src="src/components/MergeField.js"></script>
    <script src="src/components/BattleSystem.js"></script>
    <script src="src/scenes/BootScene.js"></script>
    <script src="src/scenes/GameScene.js"></script>
    <script src="src/scenes/BattleScene.js"></script>
    <script src="src/scenes/CollectionScene.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
